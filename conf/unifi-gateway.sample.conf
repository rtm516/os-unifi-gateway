# Off-box (Docker / source) configuration. The OPNsense plugin manages its own.
#
# Created automatically on first start if missing -- normally you only fill in
# the [opnsense] section. Everything else is discovered from OPNsense or
# managed by the daemon (adoption state is written back here).

[opnsense]
# Router address: IP or hostname, optionally with scheme and port
host = 192.168.1.1
# API key (System > Access > Users > API keys). Either set the values here or
# point api_key_file at the apikey.txt OPNsense lets you download.
api_key =
api_secret =
# api_key_file = /path/to/apikey.txt
# OPNsense ships a self-signed certificate; set True once you use a trusted one
verify_ssl = False
# Interfaces reported as the gateway's WAN and LAN ports, matched by
# description first, then identifier (wan, lan, opt1...), then device
# wan_interface = WAN
# lan_interface = LAN
# DHCP lease source: auto, dnsmasq, kea, isc or none
# dhcp = auto
# timeout = 15

# [gateway]
# Reported firmware: latest released for the model, or a pinned version
# firmware = latest
# Hostname reported to the controller (defaults to the router's hostname).
# hostname = my-gateway
# speedtest_file = ./speedtest.json

# [global]
# pid_file = unifi-gateway.pid
# Send UDP discovery broadcasts until adopted (needs the same L2 network)
# disable_broadcast = True
