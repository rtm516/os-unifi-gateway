name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ── OPNsense plugin package ────────────────────────────────────────

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build pkg(8) for Linux
        uses: docker/build-push-action@v6
        with:
          context: plugin
          file: plugin/Dockerfile.pkg
          tags: unifi-gateway-pkg
          load: true
          cache-from: type=gha,scope=pkg-tool
          cache-to: type=gha,scope=pkg-tool,mode=max

      - name: Build plugin package
        run: |
          docker run --rm -v "$PWD:/src" -w /src unifi-gateway-pkg \
            sh plugin/build-pkg.sh "${{ steps.version.outputs.version }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: os-unifi-gateway
          path: dist/*.pkg

  # ── Docker image (for testing against a router over its API) ───────

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── GitHub Release ─────────────────────────────────────────────────

  release:
    needs: [plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: os-unifi-gateway
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── pkg(8) repository on the pkg-repo branch ───────────────────────
  #
  # OPNsense can use the branch as a package repository:
  #   fetch -o /usr/local/etc/pkg/repos/unifi-gateway.conf \
  #     https://raw.githubusercontent.com/<owner>/<repo>/pkg-repo/unifi-gateway.conf

  publish-repo:
    needs: [plugin]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pkg-repo branch
        run: |
          if git ls-remote --exit-code --heads origin pkg-repo >/dev/null; then
            git fetch --depth 1 origin pkg-repo
            git worktree add repo origin/pkg-repo
            git -C repo checkout -B pkg-repo
          else
            git worktree add --detach repo
            git -C repo checkout --orphan pkg-repo
            git -C repo rm -rfq .
          fi

      - uses: actions/download-artifact@v4
        with:
          name: os-unifi-gateway
          path: repo/All

      - uses: docker/setup-buildx-action@v3

      - name: Build pkg(8) for Linux
        uses: docker/build-push-action@v6
        with:
          context: plugin
          file: plugin/Dockerfile.pkg
          tags: unifi-gateway-pkg
          load: true
          cache-from: type=gha,scope=pkg-tool

      - name: Rebuild repository catalogue
        run: |
          # keep the three newest releases
          ls -1t repo/All/os-unifi-gateway-*.pkg | tail -n +4 | xargs -r rm -f
          cp plugin/build-repo.sh /tmp/build-repo.sh
          docker run --rm -v "$PWD/repo:/repo" -v /tmp/build-repo.sh:/build-repo.sh \
            unifi-gateway-pkg sh /build-repo.sh /repo \
            "https://raw.githubusercontent.com/${{ github.repository }}/pkg-repo"
          sudo chown -R "$(id -u):$(id -g)" repo
          cat > repo/README.md <<EOF
          # unifi-gateway pkg repository

          Package repository for the os-unifi-gateway OPNsense plugin. See the
          [project README](https://github.com/${{ github.repository }}#installation).
          EOF

      - name: Publish
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_REF_NAME}"
          git push origin pkg-repo
