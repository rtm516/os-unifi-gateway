services:
  unifi-gateway:
    image: ghcr.io/amd989/unifi-gateway:latest
    build: .
    container_name: unifi-gateway
    restart: unless-stopped
    volumes:
      # conf/unifi-gateway.conf is created here on first start
      - ./conf:/app/conf
    environment:
      - UNIFI_GW_LOG_LEVEL=INFO
      # Router address; only used when creating the config, and overrides it
      - OPNSENSE_HOST=192.168.1.1
      # API credentials: either the apikey.txt downloaded from OPNsense...
      - OPNSENSE_API_KEY_FILE=/app/conf/apikey.txt
      # ...or the values themselves
      # - OPNSENSE_API_KEY=
      # - OPNSENSE_API_SECRET=
      # - OPNSENSE_VERIFY_SSL=true
      - UNIFI_ADOPT_URL=http://your-controller:8080/inform
