[start]
command:/usr/local/etc/rc.d/unifi_gateway start
parameters:
type:script
message:starting UniFi Gateway

[stop]
command:/usr/local/etc/rc.d/unifi_gateway stop
parameters:
type:script
message:stopping UniFi Gateway

[restart]
command:/usr/local/etc/rc.d/unifi_gateway restart
parameters:
type:script
message:restarting UniFi Gateway

[status]
command:/usr/local/etc/rc.d/unifi_gateway status; exit 0
parameters:
type:script_output
message:requesting UniFi Gateway status

[adoption]
command:UNIFI_GW_CONFIG=/var/db/unifi-gateway/unifi-gateway.conf UNIFI_GW_LOG_LEVEL=ERROR /usr/local/bin/python3 /usr/local/opnsense/scripts/unifigateway/unifi_gateway.py status
parameters:
type:script_output
message:requesting UniFi Gateway adoption state
